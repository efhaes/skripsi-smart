{% extends 'base.html' %}
{% block title %}Proses SMART{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Proses SMART</h1>
    <p>Pilih bulan & tahun yang mau dihitung untuk menentukan karyawan terbaik.</p>
</div>

<div class="card" style="max-width: 420px;">
    <form method="get">
        <div class="form-row">
            <div class="form-group">
                <label>Bulan</label>
                <select name="bulan">
                    {% for nilai, label in daftar_bulan %}
                        <option value="{{ nilai }}" {% if nilai == bulan_default %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Tahun</label>
                <select name="tahun">
                    {% for th in daftar_tahun %}
                        <option value="{{ th }}" {% if th == tahun_default %}selected{% endif %}>{{ th }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="form-actions" style="justify-content:flex-start;">
            <button type="submit" class="btn btn-primary">Lihat Preview & Proses</button>
        </div>
    </form>
</div>
{% endblock %}
