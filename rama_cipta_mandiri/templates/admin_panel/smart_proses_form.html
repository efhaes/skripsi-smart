{% extends 'base.html' %}
{% block title %}Proses Periode Baru{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Proses Periode Baru</h1>
    <p>Pilih bulan &amp; tahun, sistem akan menghitung ranking SMART untuk periode tersebut.</p>
</div>

<div class="card" style="max-width: 480px;">
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Bulan</label>
            <select name="bulan">
                {% for nilai, label in daftar_bulan %}
                    <option value="{{ nilai }}" {% if nilai == bulan_default %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Tahun</label>
            <select name="tahun">
                {% for tahun_opsi in daftar_tahun %}
                    <option value="{{ tahun_opsi }}" {% if tahun_opsi == tahun_default %}selected{% endif %}>{{ tahun_opsi }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary" style="width:100%;">Proses SMART</button>
        </div>
    </form>
</div>
{% endblock %}
